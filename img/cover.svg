<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Skill Switchboard — one source, every copy complete</title>
  <desc id="cover-desc">A quiet paper-and-ink illustration. One source sheet is wired to three target sheets; two connections are complete and one is still pending. Concept artwork, not a plugin screenshot.</desc>
  <style>
    .paper{fill:#fefcf6}.soft{fill:#f5f0e6}.ink{fill:#201c13}.muted{fill:#6d665d}.rule{stroke:#d8d0c2}.accent{stroke:#c24e18}.moss{stroke:#406e40}.sheet{fill:#fefcf6;stroke:#d8d0c2}.line{fill:none;stroke-width:1.5;stroke-linecap:round}.serif{font-family:"IBM Plex Serif","Noto Serif SC",Georgia,serif}.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px;letter-spacing:1.5px}.copy{font-family:"IBM Plex Sans","Noto Sans SC",sans-serif;font-size:15px}
    @media(prefers-color-scheme:dark){.paper{fill:#29261f}.soft{fill:#201d18}.ink{fill:#f5f0e4}.muted{fill:#b4ad9f}.rule{stroke:#4e473b}.accent{stroke:#eda16c}.moss{stroke:#a3bf95}.sheet{fill:#29261f;stroke:#4e473b}}
  </style>
  <rect width="1200" height="480" class="paper"/>
  <text x="40" y="36" class="mono muted">OUATIS / OBSIDIAN</text>
  <text x="1160" y="36" text-anchor="end" class="mono muted">03 / LINES</text>
  <path d="M40 56H1160M40 424H1160" class="rule" fill="none"/>
  <text x="60" y="160" class="serif ink" font-size="56">Skill Switchboard</text>
  <text x="60" y="224" class="serif ink" font-size="30">One source,</text>
  <text x="60" y="263" class="serif ink" font-size="30">every copy complete.</text>
  <text x="60" y="323" class="copy muted">Keep the skill source honest. Wire it to every agent on this desk.</text>
  <text x="60" y="374" class="mono muted">SKILLS / LINES / COPIES</text>
  <rect x="628" y="95" width="516" height="285" rx="12" class="soft"/>
  <rect x="668" y="150" width="150" height="176" rx="6" class="sheet"/>
  <g class="muted">
    <rect x="690" y="176" width="106" height="5" rx="2" opacity=".55"/>
    <rect x="690" y="192" width="80" height="5" rx="2" opacity=".55"/>
    <rect x="690" y="226" width="9" height="9" rx="2" opacity=".75"/>
    <rect x="690" y="252" width="9" height="9" rx="2" opacity=".75"/>
    <rect x="690" y="278" width="9" height="9" rx="2" opacity=".75"/>
  </g>
  <rect x="938" y="128" width="184" height="52" rx="6" class="sheet"/>
  <rect x="938" y="198" width="184" height="52" rx="6" class="sheet"/>
  <rect x="938" y="268" width="184" height="52" rx="6" class="sheet"/>
  <g class="muted">
    <rect x="960" y="146" width="104" height="5" rx="2" opacity=".55"/>
    <rect x="960" y="160" width="72" height="5" rx="2" opacity=".55"/>
    <rect x="960" y="216" width="104" height="5" rx="2" opacity=".55"/>
    <rect x="960" y="230" width="72" height="5" rx="2" opacity=".55"/>
    <rect x="960" y="286" width="104" height="5" rx="2" opacity=".55"/>
    <rect x="960" y="300" width="72" height="5" rx="2" opacity=".55"/>
  </g>
  <path d="M818 231C880 231 880 154 938 154" class="line moss"/>
  <path d="M818 257C880 257 880 224 938 224" class="line moss"/>
  <path d="M818 283C880 283 880 294 938 294" class="line accent" stroke-dasharray="1 6"/>
  <circle cx="818" cy="231" r="3.5" class="moss" fill="none"/>
  <circle cx="818" cy="257" r="3.5" class="moss" fill="none"/>
  <circle cx="818" cy="283" r="3.5" class="accent" fill="none"/>
  <path d="M1108 147L1116 154L1108 161M1116 216L1124 223L1116 230M1124 294L1116 301" class="moss" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="668" y="374" class="mono muted">SOURCE</text>
  <text x="1122" y="374" text-anchor="end" class="mono muted">RUNTIME TARGETS</text>
  <text x="40" y="453" class="mono muted">SKILL SWITCHBOARD · SKILL DISTRIBUTION</text>
  <text x="1160" y="453" text-anchor="end" class="copy muted" font-size="12">Concept illustration · not a screenshot</text>
