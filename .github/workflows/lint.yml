name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run test:scanner
            - run: npm run test:readiness
            - run: npm run test:lifecycle
            - run: npm run test:machine-settings
            - run: npm run test:build-id
            - run: npm run test:status-queue
            - run: npm run test:native
            - run: npm run test:adapter
            - run: npm run test:vault-changes
            - run: npm run test:distribution
            - run: npm run test:ui
            - run: npm run test:release-validation
            - run: npm run lint

    path-portability:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run test:scanner
            - run: npm run test:readiness
            - run: npm run test:lifecycle
            - run: npm run test:machine-settings
            - run: npm run test:build-id
            - run: npm run test:status-queue
            - run: npm run test:native
            - run: npm run test:adapter
            - run: npm run test:vault-changes
            - run: npm run test:distribution
            - run: npm run test:ui
            - run: npm run test:release-validation
