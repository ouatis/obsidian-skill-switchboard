name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release tag and version metadata
              run: node scripts/validate-release.mjs "$GITHUB_REF_NAME"

            - name: Test and audit before publishing
              run: |
                  npm ci
                  npm run audit:deps
                  npm test

            - name: Build plugin
              run: npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # 重推同一 tag 时 release 可能已存在(此前 0.8.0 双 CI 撞
                  # "a release with the same tag name already exists" 双红):
                  # 已存在则只补资产并刷新 notes,不存在才新建
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release upload "$tag" --clobber \
                        main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
                      gh release edit "$tag" --generate-notes
                  else
                      gh release create "$tag" \
                        --title="$tag" \
                        --generate-notes \
                        main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
                  fi
